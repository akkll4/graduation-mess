<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Messages - Before We Graduate</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/gate.css" />
  <link rel="stylesheet" href="css/messages.css" />
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
</head>
<body>

  <header class="topbar">
    <div class="container topbar-inner">
      <a href="index.html" class="brand">
        <span class="brand-badge">🩺</span>
        <span>Before We Graduate</span>
      </a>
      <nav class="nav" id="siteNav" aria-label="Main navigation">
        <a href="index.html">Home</a>
        <a href="send.html">Send Message</a>
        <a href="messages.html" class="active">Messages</a>
        <a href="qa.html">Q&A</a>
        <a href="votes.html">Votes</a>
        <a href="match.html" >Classmate Match</a>
      </nav>
      <button class="menu-btn" id="menuBtn" aria-label="Toggle menu">☰</button>
    </div>
  </header>

  <main id="main" class="container messages-container">
    
    <!-- Loading State -->
    <div id="loadingState" class="state-card">
      <div class="spinner"></div>
      <p>Loading memories...</p>
    </div>

    <!-- Empty State -->
    <div id="emptyState" class="state-card" hidden>
      <div class="state-icon">📭</div>
      <h3>No messages yet</h3>
      <p>Be the first to leave a memory for the batch!</p>
      <a href="send.html" class="btn btn-gold">Write a Message</a>
    </div>

    <!-- Messages List (Shows ALL messages) -->
    <div id="messagesList" class="messages-list" hidden></div>

  </main>

  <footer class="footer">
    <div class="container footer-inner">
      <span>Made with caffeine, stress, and graduation dreams.</span>
      <span class="footer-dot">•</span>
      <span>Class memory project</span>
    </div>
  </footer>

  <div id="gate-root"></div>
  <script src="https://cdn.jsdelivr.net/npm/idb-keyval@6/dist/umd.js"></script>
  <script src="js/main.js"></script>
  <script src="js/gate.js"></script>
  <script src="js/messages.js"></script>
</body>
</html>
