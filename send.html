<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Send Message - Before We Graduate</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/gate.css" />
  <link rel="stylesheet" href="css/send.css" />
  
  <!-- Supabase JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
</head>
<body>

  <header class="topbar">
    <div class="container topbar-inner">
      <a href="index.html" class="brand">
        <span class="brand-badge">🩺</span>
        <span>Before We Graduate</span>
      </a>
      <nav class="nav" id="siteNav" aria-label="Main navigation">
        <a href="index.html">Home</a>
        <a href="send.html" class="active">Send Message</a>
        <a href="messages.html">Messages</a>
        <a href="qa.html">Q&A</a>
        <a href="votes.html">Votes</a>
        <a href="match.html" >Classmate Match</a>
      </nav>
      <button class="menu-btn" id="menuBtn" aria-label="Toggle menu">☰</button>
    </div>
  </header>

  <main id="main" class="container">
    <section class="section send-section">
      <div class="send-card">
        <div class="send-header">
          <h2>Leave a Message</h2>
          <p>Write a memory, a thank-you note, or a wish for the batch. Max 150 words.</p>
        </div>

<form id="messageForm">
  <div class="form-group">
    <label for="messageContent">Your Message *</label>
    <textarea 
      id="messageContent" 
      rows="6" 
      placeholder="Remember that time in anatomy lab..." 
      maxlength="1000"
      required
    ></textarea>
    <div class="word-count">
      <span id="wordCount">0</span> / 150 words
    </div>
  </div>

  <button type="submit" id="submitBtn" class="btn btn-gold send-btn" disabled>
    Send Message
  </button>

  <div id="formMessage" class="form-message" hidden></div>
</form>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container footer-inner">
      <span>Made with caffeine, stress, and graduation dreams.</span>
      <span class="footer-dot">•</span>
      <span>Class memory project</span>
    </div>
  </footer>

  <!-- Gate & Scripts -->
  <div id="gate-root"></div>
  <script src="https://cdn.jsdelivr.net/npm/idb-keyval@6/dist/umd.js"></script>
  <script src="js/main.js"></script>
  <script src="js/gate.js"></script>
  <script src="js/send.js"></script>
</body>
</html>
